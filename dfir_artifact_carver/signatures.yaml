# =============================================================================
# dfir_artifact_carver — Signatures Configuration
# =============================================================================
#
# Each entry defines one file type to carve. Fields:
#
#   name         : Human-readable name shown in reports
#   category     : Grouping (used for output subfolder and filtering)
#   extension    : File extension for carved output
#   header       : Hex bytes at start of file (space-separated, e.g. "FF D8 FF")
#   footer       : (optional) Hex bytes marking end of file
#   header_offset: (optional) Byte offset where header appears (default: 0)
#   max_size_mb  : Max carved file size in MB (prevents runaway carves)
#   min_size_kb  : Minimum size to keep in KB (default: 1)
#   validate     : Run format validation after carving (true/false)
#   enabled      : Set to false to skip this signature without deleting it
#
# Tips:
#   - Use ?? as a wildcard byte in header/footer (e.g. "FF D8 FF ?? E0")
#   - Shorter headers = more false positives; longer = more missed hits
#   - max_size_mb is critical for footerless formats – set conservatively
# =============================================================================

signatures:

  # ---------------------------------------------------------------------------
  # IMAGES
  # ---------------------------------------------------------------------------
  - name: JPEG Image
    category: Images
    extension: jpg
    header: "FF D8 FF"
    footer: "FF D9"
    max_size_mb: 50
    validate: true
    enabled: true

  - name: PNG Image
    category: Images
    extension: png
    header: "89 50 4E 47 0D 0A 1A 0A"
    footer: "49 45 4E 44 AE 42 60 82"
    max_size_mb: 100
    validate: true
    enabled: true

  - name: GIF Image
    category: Images
    extension: gif
    header: "47 49 46 38"
    footer: "00 3B"
    max_size_mb: 20
    validate: true
    enabled: true

  - name: BMP Image
    category: Images
    extension: bmp
    header: "42 4D"
    max_size_mb: 50
    validate: false
    enabled: true

  - name: HEIC Image (iPhone)
    category: Images
    extension: heic
    header: "00 00 00 ?? 66 74 79 70 68 65 69 63"
    header_offset: 0
    max_size_mb: 50
    validate: false
    enabled: true

  - name: WebP Image
    category: Images
    extension: webp
    header: "52 49 46 46"
    max_size_mb: 50
    validate: false
    enabled: true

  - name: Canon RAW (CR2)
    category: Images
    extension: cr2
    header: "49 49 2A 00 10 00 00 00 43 52"
    max_size_mb: 100
    validate: false
    enabled: true

  - name: TIFF Image
    category: Images
    extension: tiff
    header: "49 49 2A 00"
    max_size_mb: 100
    validate: false
    enabled: true

  # ---------------------------------------------------------------------------
  # DOCUMENTS
  # ---------------------------------------------------------------------------
